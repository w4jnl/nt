name: Bug report
description: Something nt does wrong, with enough to reproduce it.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: One paragraph each. Say which command or key, and in which note or folder.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: In a fresh repository if you can, so no private notes are needed.
      placeholder: |
        1. nt init /tmp/notes
        2. nt a "a line"
        3. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `nt doctor` and `nt version`
      description: Paste both. `nt doctor` reports the repository, git, the sync timer, the tools and the links it sees.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and terminal
      placeholder: macOS 15.1, Ghostty 1.2, tmux 3.5 / Ubuntu 24.04, kitty
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Relevant lines from `~/.local/state/nt/sync.log` or `agent.log`, a screenshot.
