<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <!-- The demo note's image: the NAS between the laptops and the backup box, in nt's dark tokens. -->
  <rect width="1200" height="380" rx="18" fill="#1A2023"/>
  <g font-family="Menlo, monospace" fill="#F2F5F5">
    <text x="60" y="64" font-size="26" fill="#8A999C">home lab · storage</text>
    <g stroke="#3FD0D4" stroke-width="3" fill="none">
      <rect x="60" y="120" width="260" height="170" rx="14"/>
      <rect x="470" y="100" width="300" height="210" rx="14" stroke-width="4"/>
      <rect x="900" y="120" width="240" height="170" rx="14"/>
      <path d="M320 205 H470" marker-end="url(#a)"/>
      <path d="M770 205 H900" marker-end="url(#a)"/>
    </g>
    <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="15" refY="8" orient="auto"><path d="M0 0 L16 8 L0 16 z" fill="#3FD0D4"/></marker></defs>
    <text x="190" y="190" font-size="30" text-anchor="middle">laptops</text>
    <text x="190" y="232" font-size="22" text-anchor="middle" fill="#8A999C">NFS, VLAN 10</text>
    <text x="620" y="172" font-size="34" text-anchor="middle" font-weight="bold">NAS</text>
    <text x="620" y="214" font-size="22" text-anchor="middle" fill="#8A999C">RAID-Z1 · 4 × 8 TB</text>
    <g fill="#5FC47A"><circle cx="560" cy="262" r="9"/><circle cx="600" cy="262" r="9"/><circle cx="640" cy="262" r="9"/></g>
    <circle cx="680" cy="262" r="9" fill="#E8963C"/>
    <text x="1020" y="190" font-size="30" text-anchor="middle">backup</text>
    <text x="1020" y="232" font-size="22" text-anchor="middle" fill="#8A999C">Synology</text>
    <text x="835" y="186" font-size="20" text-anchor="middle" fill="#3FD0D4">restic</text>
    <text x="835" y="240" font-size="20" text-anchor="middle" fill="#8A999C">02:00</text>
    <text x="395" y="186" font-size="20" text-anchor="middle" fill="#3FD0D4">nfs</text>
  </g>
</svg>
