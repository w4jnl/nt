<!doctype html>
<!-- assets/demo/phone.sh copies this next to the simulator's shots (shots/*.png) and renders it
     with headless Chrome to assets/readme/phone-screens.jpg (920x712 at 2x): three screens as
     the phone shows them, their corners rounded and a hairline edge, on the brand's ground
     colour, a caption under each. The fonts are the design system's. -->
<html><head><meta charset="utf-8">
<style>
  @font-face{font-family:"JetBrains Mono";font-weight:400;src:url("fonts/JetBrainsMono-400.woff2") format("woff2")}
  @font-face{font-family:"JetBrains Mono";font-weight:700;src:url("fonts/JetBrainsMono-700.woff2") format("woff2")}
  html,body{margin:0;width:920px;height:712px;overflow:hidden;background:#14181A;color:#E9EFF0;font-family:"JetBrains Mono",ui-monospace,monospace}
  .row{position:absolute;left:0;right:0;top:34px;display:flex;justify-content:center;gap:26px}
  .ph{width:276px;text-align:center}
  .frame img{display:block;width:276px;height:598px;border-radius:40px;outline:1px solid #263034}
  h3{margin:18px 0 4px;font-size:15px;font-weight:700}
  p{margin:0;font-size:12.5px;color:#8A999C}
</style></head><body>
<div class="row">
  <div class="ph"><div class="frame"><img src="shots/home.png"></div>
    <h3>home</h3><p>the views, the pins, every folder</p></div>
  <div class="ph"><div class="frame"><img src="shots/note.png"></div>
    <h3>the note</h3><p>live preview, written in place</p></div>
  <div class="ph"><div class="frame"><img src="shots/todos.png"></div>
    <h3>todos</h3><p>overdue first, ticked with a tap</p></div>
</div>
</body></html>
